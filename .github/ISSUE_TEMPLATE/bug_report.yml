name: Bug report
description: Something in edu-code-camp does not work.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
        4.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: lesson
    attributes:
      label: Lesson or page
      description: Copy the address from the address bar, e.g. .../#/lesson/py/print
  - type: dropdown
    id: look
    attributes:
      label: Look
      options:
        - Win98 + glass
        - Liquid glass
        - Terminal
        - 8-bit arcade
        - Spot's yard
        - Rubber hose
        - Hi-fi deck
        - Editorial paper
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. 22
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
