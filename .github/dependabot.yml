version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
