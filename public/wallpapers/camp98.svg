    </linearGradient>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000" opacity=".08"/><rect x="2" y="2" width="2" height="2" fill="#000" opacity=".08"/>
    </pattern>
    <g id="pine"><path d="M0 0l-26 46h12l-20 34h14l-22 38h84l-22-38h14l-20-34h12z"/><rect x="-5" y="118" width="10" height="16"/></g>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#e0fff8">
