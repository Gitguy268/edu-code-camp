    <path d="M-34 6L34-6M-34-6L34 6" stroke="#5b3a1e" stroke-width="10" stroke-linecap="round"/>
    <path d="M0-74C14-46 30-34 22-12 16 4-16 4-22-12-30-34-10-46 0-74z" fill="#ff7a1a"/>
