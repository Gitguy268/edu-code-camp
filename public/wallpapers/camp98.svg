    <circle cx="640" cy="230" r="2"/><circle cx="980" cy="250" r="1.5"/><circle cx="1240" cy="260" r="2"/><circle cx="60" cy="300" r="1.5"/>
  </g>
  <circle cx="1280" cy="190" r="70" fill="#fff6d5"/><circle cx="1305" cy="175" r="66" fill="#006b6b" opacity=".9"/>
  <path d="M0 640L180 450 300 560 460 380 640 590 820 420 1000 600 1180 410 1360 580 1500 470 1600 560V1000H0z" fill="#00605f"/>
  <path d="M0 640L180 450 220 488 160 520 200 540z M460 380L520 450 470 470 500 500z M820 420L880 480 830 500z M1180 410L1240 470 1190 490z" fill="#d8f4ef" opacity=".55"/>
  <path d="M0 720L240 600 420 700 640 620 860 720 1080 640 1300 730 1600 640V1000H0z" fill="#004848"/>
