    <use href="#pine" x="90" y="640"/><use href="#pine" x="210" y="690" transform="scale(1)"/><use href="#pine" x="380" y="660"/>
    <use href="#pine" x="1180" y="650"/><use href="#pine" x="1320" y="700"/><use href="#pine" x="1480" y="660"/>
