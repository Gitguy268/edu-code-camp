<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- edu-code-camp's own Win98-style wallpaper: a teal night over a pine valley. MIT, like the app. -->
  <defs>
